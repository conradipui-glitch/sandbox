name: Deploy Florence Preview

on:
  push:
    branches: [feat/florence-vertical-slice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-florence-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name living-history-florence-preview --keep-vars

      - name: Configure preview narrator when repository key is available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLORENCE_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$FLORENCE_DEEPSEEK_KEY" ]; then
            printf '%s' "$FLORENCE_DEEPSEEK_KEY" | npx wrangler secret put DEEPSEEK_API_KEY --name living-history-florence-preview
          else
            echo 'No repository narrator key; preview uses Workers AI.'
          fi
