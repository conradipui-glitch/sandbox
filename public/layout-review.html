<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка размеров экрана</title>
<style>body{margin:0;background:#ddd;font:16px system-ui}header{padding:8px;display:flex;gap:12px;align-items:center}iframe{display:block;width:390px;height:844px;margin:0 auto;border:1px solid #777;background:white}select{font:inherit;padding:5px}</style>
<header><label>Экран <select id="size"><option value="390,844">Телефон · 390 × 844</option><option value="820,1180">Планшет · 820 × 1180</option><option value="1280,900">Компьютер · 1280 × 900</option></select></label><span>Техническая страница проверки вёрстки</span></header>
<iframe title="Игра на выбранном экране" src="/"></iframe>
<script>document.querySelector('select').addEventListener('change',event=>{const [w,h]=event.target.value.split(',');const frame=document.querySelector('iframe');frame.style.width=w+'px';frame.style.height=h+'px';});</script>
</html>
